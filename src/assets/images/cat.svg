<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="60" fill="#FF9F43"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="45" fill="#FF9F43"/>
  <!-- Left ear -->
  <polygon points="60,45 45,10 80,35" fill="#FF9F43"/>
  <polygon points="62,42 50,18 76,36" fill="#FFB6C1"/>
  <!-- Right ear -->
  <polygon points="140,45 155,10 120,35" fill="#FF9F43"/>
  <polygon points="138,42 150,18 124,36" fill="#FFB6C1"/>
  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="82" cy="75" rx="10" ry="12" fill="white"/>
  <ellipse cx="118" cy="75" rx="10" ry="12" fill="white"/>
  <ellipse cx="84" cy="76" rx="6" ry="8" fill="#333"/>
  <ellipse cx="120" cy="76" rx="6" ry="8" fill="#333"/>
  <circle cx="86" cy="74" r="2" fill="white"/>
  <circle cx="122" cy="74" r="2" fill="white"/>
  <!-- Nose -->
  <polygon points="100,88 95,94 105,94" fill="#FF6B9D"/>
  <!-- Mouth -->
  <path d="M95,94 Q100,100 105,94" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Whiskers -->
  <line x1="60" y1="88" x2="90" y2="92" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="94" x2="90" y2="94" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="90" y2="96" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="88" x2="110" y2="92" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="94" x2="110" y2="94" stroke="#555" stroke-width="1.5"/>
  <line x1="140" y1="100" x2="110" y2="96" stroke="#555" stroke-width="1.5"/>
  <!-- Arms -->
  <ellipse cx="52" cy="155" rx="18" ry="12" fill="#FF9F43" transform="rotate(-30 52 155)"/>
  <ellipse cx="148" cy="155" rx="18" ry="12" fill="#FF9F43" transform="rotate(30 148 155)"/>
  <!-- Legs -->
  <ellipse cx="75" cy="200" rx="18" ry="12" fill="#FF9F43"/>
  <ellipse cx="125" cy="200" rx="18" ry="12" fill="#FF9F43"/>
  <!-- Tail -->
  <path d="M150,170 Q185,150 175,120 Q165,95 180,85" stroke="#FF9F43" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Belly -->
  <ellipse cx="100" cy="155" rx="30" ry="35" fill="#FFD0A0" opacity="0.6"/>
  <!-- Cheeks -->
  <ellipse cx="72" cy="90" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="128" cy="90" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
</svg>
